# -------------------------------------------------------------
# VisionMart - Reverse proxy
# -------------------------------------------------------------

upstream visionmart_backend {
    server backend:8000;
}

upstream visionmart_frontend {
    server frontend:3000;
}

upstream visionmart_ai_engine {
    server ai-engine:8100;
}

server {
    listen 80;
    server_name _;

    # Backend REST API
    location /api/ {
        proxy_pass         http://visionmart_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket
    location /ws/ {
        proxy_pass         http://visionmart_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # AI Engine (internal-only in production; exposed here for development)
    location /ai/ {
        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass         http://visionmart_ai_engine;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Health
    location = /health {
        proxy_pass http://visionmart_backend/health;
    }

    # SPA (catch-all)
    location / {
        proxy_pass         http://visionmart_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
