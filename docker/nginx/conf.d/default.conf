# -------------------------------------------------------------
# VisionMart - Reverse proxy
# -------------------------------------------------------------

upstream visionmart_backend   { server backend:8000;   }
upstream visionmart_frontend  { server frontend:3000;  }
upstream visionmart_ai_engine { server ai-engine:8100; }

# Basic rate-limit zone for API traffic (20 req/s with burst).
limit_req_zone $binary_remote_addr zone=visionmart_api:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    # ---- Security headers ----
    add_header X-Content-Type-Options    "nosniff"                    always;
    add_header X-Frame-Options           "DENY"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header X-XSS-Protection          "0"                          always;

    # ---- Backend REST API ----
    location /api/ {
        limit_req zone=visionmart_api burst=40 nodelay;
        proxy_pass         http://visionmart_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_read_timeout 60s;
    }

    # ---- WebSocket ----
    location /ws/ {
        proxy_pass         http://visionmart_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # ---- AI Engine (internal in production; exposed here for dev only) ----
    location /ai/ {
        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass         http://visionmart_ai_engine;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Request-ID $request_id;
    }

    # ---- Health ----
    location = /health {
        access_log off;
        proxy_pass http://visionmart_backend/health;
    }

    # ---- SPA (catch-all) ----
    location / {
        proxy_pass         http://visionmart_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
