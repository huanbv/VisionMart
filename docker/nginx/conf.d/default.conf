# -------------------------------------------------------------
# VisionMart - Reverse proxy
# -------------------------------------------------------------

# KHÔNG dùng khối `upstream { server backend:8000; }` nữa: nginx phân giải
# tên đó thành IP MỘT LẦN lúc load config rồi cache vĩnh viễn. Khi
# `docker compose up -d --build <service>` tạo lại container, IP đổi (vd
# frontend 172.18.0.2 -> 172.18.0.5) nhưng nginx (không được tạo lại) vẫn gọi
# IP cũ -> "connect() failed (111: Connection refused)" -> 502 cho tới khi
# restart nginx thủ công.
#
# Cách chống kẹt IP: đặt tên service vào BIẾN rồi proxy_pass qua biến đó, kèm
# `resolver 127.0.0.11` (DNS nội bộ của Docker). Có biến trong proxy_pass thì
# nginx phân giải LẠI theo từng request (tôn trọng valid=10s) thay vì cache
# một lần — rebuild đổi IP bao nhiêu lần cũng tự bắt kịp, không cần restart.

# Basic rate-limit zone for API traffic (20 req/s with burst).
limit_req_zone $binary_remote_addr zone=visionmart_api:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    # DNS nội bộ của Docker — bắt buộc để proxy_pass qua biến phân giải được
    # tên service. valid=10s: nhớ kết quả tối đa 10 giây rồi hỏi lại.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- Security headers ----
    add_header X-Content-Type-Options    "nosniff"                    always;
    add_header X-Frame-Options           "DENY"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header X-XSS-Protection          "0"                          always;

    # ---- Backend REST API ----
    location /api/ {
        limit_req zone=visionmart_api burst=40 nodelay;
        set $upstream_backend backend:8000;
        proxy_pass         http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_read_timeout 60s;
        # POST /cameras/{id}/simulated-stream (camera-sim demo video
        # upload) accepts up to 200 MB server-side -- without this
        # override, the global 50m in nginx.conf 413s any upload past
        # that, before the request even reaches the backend.
        client_max_body_size 200m;
        client_body_timeout  120s;
    }

    # ---- Camera live view (continuous MJPEG stream) ----
    # Matches /api/v1/cameras/{uuid}/live specifically, ahead of the
    # general /api/ block above -- that block's proxy_read_timeout 60s
    # would kill the connection after a minute, and its default
    # proxy_buffering would delay/batch frames instead of forwarding
    # them as they arrive.
    location ~ ^/api/v1/cameras/[^/]+/live$ {
        limit_req zone=visionmart_api burst=40 nodelay;
        set $upstream_backend backend:8000;
        proxy_pass         http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
    }

    # ---- WebSocket ----
    location /ws/ {
        set $upstream_backend backend:8000;
        proxy_pass         http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # ---- AI Engine (internal in production; exposed here for dev only) ----
    location /ai/ {
        set $upstream_ai ai-engine:8100;
        # rewrite strip tiền tố /ai/ -> $uri thành /<đường-dẫn-còn-lại>. Với
        # proxy_pass qua BIẾN phải ghi URI tường minh ($uri$is_args$args) chứ
        # không để trống, vì proxy_pass biến + không-URI có hành vi đường dẫn
        # nhập nhằng sau rewrite. Dạng này giữ đúng: strip /ai/ + kèm query.
        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass         http://$upstream_ai$uri$is_args$args;
        proxy_http_version 1.1;
        client_max_body_size 50m;
        proxy_read_timeout 120s;
        # proxy_request_buffering off: KHÔNG ghi body ra file tạm
        # (/var/cache/nginx/client_temp) trước khi forward — stream thẳng
        # sang ai-engine. Bật buffering (mặc định) khiến MỌI POST /ai/frame
        # với ảnh vượt vài chục KB (luôn đúng — JPEG một khung hình) trả về
        # 500 RỖNG (Content-Type: text/plain, không phải JSON của FastAPI)
        # ngay tại nginx — ai-engine không hề nhận được request (0 dòng log,
        # container không restart/OOM). Access log luôn kèm cảnh báo "a
        # client request body is buffered to a temporary file" ngay trước
        # mỗi lần 500 — tắt hẳn bước buffer-ra-đĩa này loại bỏ toàn bộ
        # nhóm lỗi thay vì đoán tiếp nguyên nhân write/read file tạm thất
        # bại vì sao (đĩa và quyền thư mục đã kiểm tra đều ổn).
        proxy_request_buffering off;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Request-ID $request_id;
    }

    # ---- Health ----
    location = /health {
        access_log off;
        set $upstream_backend backend:8000;
        proxy_pass http://$upstream_backend/health;
    }

    # ---- MinIO S3 bucket (presigned URLs) ----
    location /visionmart/ {
        set $upstream_minio minio:9000;
        proxy_pass         http://$upstream_minio;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }

    # Scanners probe /.git/config. Vite maps /@vite/client → client.mjs, so
    # /@vite/client/.git/config becomes client.mjs/.git/config (ENOTDIR overlay).
    location ~* /\.git {
        access_log off;
        return 404;
    }

    # ---- SPA (catch-all) ----
    location / {
        set $upstream_frontend frontend:3000;
        proxy_pass         http://$upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
