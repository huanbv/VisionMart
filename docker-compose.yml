# =============================================================
# VisionMart - Local development stack
# Production overrides should live in docker-compose.prod.yml
# =============================================================

name: visionmart

x-logging: &default-logging
  # "local" (Docker >= 20.10) instead of "json-file": same max-size/max-file
  # rotation semantics, but rotated files are stored compressed on disk —
  # gives every service (backend, ai-engine, celery, frontend, nginx,
  # monitoring) gzip-equivalent log compression with zero application code
  # changes. `docker logs <container>` works exactly the same either way.
  # See docs/18_LOGGING.md for the full log-management design.
  driver: local
  options:
    max-size: "${LOG_MAX_FILE_SIZE:-100m}"
    max-file: "${LOG_MAX_FILES:-5}"

x-restart: &default-restart
  restart: unless-stopped

services:
  # ----------------------------------------------------------
  # Data services
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: visionmart-postgres
    <<: *default-restart
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visionmart}
      POSTGRES_USER: ${POSTGRES_USER:-visionmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visionmart}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visionmart}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [visionmart-net]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: visionmart-redis
    <<: *default-restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [visionmart-net]
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: visionmart-minio
    <<: *default-restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-visionmart}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-visionmart-minio}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [visionmart-net]
    logging: *default-logging

  # ----------------------------------------------------------
  # Application services
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    image: visionmart/backend:dev
    container_name: visionmart-backend
    <<: *default-restart
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_started }
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [visionmart-net]
    logging: *default-logging

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    image: visionmart/backend:dev
    container_name: visionmart-celery-worker
    <<: *default-restart
    env_file: .env
    depends_on:
      redis:    { condition: service_healthy }
      backend:  { condition: service_started }
    volumes:
      - ./backend:/app
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
    networks: [visionmart-net]
    logging: *default-logging

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    image: visionmart/backend:dev
    container_name: visionmart-celery-beat
    <<: *default-restart
    env_file: .env
    depends_on:
      redis:         { condition: service_healthy }
      celery-worker: { condition: service_started }
    volumes:
      - ./backend:/app
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]
    networks: [visionmart-net]
    logging: *default-logging

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    image: visionmart/ai-engine:dev
    container_name: visionmart-ai-engine
    <<: *default-restart
    env_file: .env
    environment:
      YOLO_MODEL: ${YOLO_MODEL:-yolov8n.pt}
      YOLO_CONF_THRESHOLD: ${YOLO_CONF_THRESHOLD:-0.25}
      YOLO_DEVICE: ${YOLO_DEVICE:-cpu}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-visionmart}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-visionmart-minio}
      MINIO_BUCKET: ${MINIO_BUCKET:-visionmart}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MODELS_DIR: /models
      TRAINING_ROOT: /app/training
    volumes:
      - ./ai-engine:/app
      - ./ai-engine/config:/app/config
      - ./models:/models
      - ai_engine_training:/app/training
      - ai_engine_weights:/root/.config/Ultralytics
    ports:
      - "${AI_ENGINE_PORT:-8100}:8100"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8100", "--workers", "1"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [visionmart-net]
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    image: visionmart/frontend:dev
    container_name: visionmart-frontend
    <<: *default-restart
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    networks: [visionmart-net]
    logging: *default-logging

  # ----------------------------------------------------------
  # Operational Monitoring (read-only; see monitoring/__init__.py)
  # ----------------------------------------------------------
  monitoring:
    build:
      context: .
      dockerfile: monitoring/Dockerfile
    image: visionmart/monitoring:dev
    container_name: visionmart-monitoring
    <<: *default-restart
    env_file: .env
    environment:
      MONITORING_BACKEND_URL: http://backend:8000
      MONITORING_AI_ENGINE_URL: http://ai-engine:8100
      MONITORING_SQLITE_PATH: /data/monitoring.db
      MONITORING_LOG_DIR: /data/logs
      MONITORING_EVALUATION_REPORTS_DIR: /app/repo/evaluation_results
    depends_on:
      backend:   { condition: service_started }
      ai-engine: { condition: service_started }
      redis:     { condition: service_healthy }
    volumes:
      - ./monitoring:/app/monitoring
      - monitoring_data:/data
      # Read-only: lets the (optional) Evaluation signal in the Health Score
      # / Production Readiness Report see evaluation_results/, and lets the
      # Release Information endpoint read release_info.json if generated
      # (see scripts/generate_release_info.py). Monitoring never writes here.
      - .:/app/repo:ro
      # Optional: uncomment to enable Docker-container health checks (§ requirement 4).
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${MONITORING_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8200/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [visionmart-net]
    logging: *default-logging

  # ----------------------------------------------------------
  # Automatic Backup (read-only against production; see backup/__init__.py)
  # ----------------------------------------------------------
  # Optional in-stack scheduler. Most VPS deployments are equally well
  # served by host cron calling `docker compose run --rm backup-once`
  # once a day (see docs/43_BACKUP_RECOVERY.md) instead of running this
  # always-on container — both paths call the exact same
  # `python -m backup.cli` command, so pick whichever fits your ops
  # preference. Enable with: `docker compose --profile backup up -d backup`.
  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    image: visionmart/backup:dev
    container_name: visionmart-backup
    profiles: ["backup"]
    <<: *default-restart
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MONITORING_SQLITE_PATH: /data/monitoring.db
      BACKUP_EVALUATION_REPORTS_DIR: /app/repo/evaluation_results
      BACKUP_REPO_ROOT: /app/repo
      BACKUP_DIR: /backups
      BACKUP_LOG_DIR: /data/logs
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - .:/app/repo:ro
      - monitoring_data:/data:ro
      - backups_data:/backups
    networks: [visionmart-net]
    logging: *default-logging

  # One-shot variant of the same image for host-cron-triggered manual/daily
  # runs: `docker compose run --rm backup-once` (never left running).
  backup-once:
    build:
      context: .
      dockerfile: backup/Dockerfile
    image: visionmart/backup:dev
    container_name: visionmart-backup-once
    profiles: ["backup-once"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MONITORING_SQLITE_PATH: /data/monitoring.db
      BACKUP_EVALUATION_REPORTS_DIR: /app/repo/evaluation_results
      BACKUP_REPO_ROOT: /app/repo
      BACKUP_DIR: /backups
      BACKUP_LOG_DIR: /data/logs
    command: ["python", "-m", "backup.cli", "run"]
    volumes:
      - .:/app/repo:ro
      - monitoring_data:/data:ro
      - backups_data:/backups
    networks: [visionmart-net]
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    container_name: visionmart-nginx
    <<: *default-restart
    depends_on:
      backend:   { condition: service_started }
      frontend:  { condition: service_started }
      ai-engine: { condition: service_started }
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    networks: [visionmart-net]
    logging: *default-logging

# --------------------------------------------------------------
networks:
  visionmart-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ai_engine_weights:
  ai_engine_training:
  monitoring_data:
  backups_data:
